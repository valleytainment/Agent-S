name: Temporary GSMG Twitter April-19 metadata probe

on:
  push:
    branches:
      - agent/gsmg-bf7siz-probe
    paths:
      - '.github/workflows/gsmg-bf7siz-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect exact April-19 Twitter stream file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request
          req=urllib.request.Request('https://archive.org/metadata/archiveteam-twitter-stream-2019-04',headers={'User-Agent':'gsmg-historical-object-probe/1.5'})
          with urllib.request.urlopen(req,timeout=30) as r: meta=json.load(r)
          files=[]
          for f in meta.get('files',[]):
              name=f.get('name','')
              if '2019_04_19' in name or '2019-04-19' in name:
                  files.append({k:f.get(k) for k in ['name','size','md5','sha1','crc32','mtime','format','source']})
          print('GSMG_TWITTER_APRIL19_RECEIPT_BEGIN')
          print(json.dumps({'identifier':meta.get('metadata',{}).get('identifier'),'file_count':len(meta.get('files',[])),'april19_files':files},separators=(',',':')))
          print('GSMG_TWITTER_APRIL19_RECEIPT_END')
          if not files: raise SystemExit('No April-19 file found in item metadata')
          PY
