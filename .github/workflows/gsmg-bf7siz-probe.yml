name: Temporary GSMG targeted archive probe

on:
  push:
    branches:
      - agent/gsmg-bf7siz-probe
    paths:
      - '.github/workflows/gsmg-bf7siz-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect April Twitter item and Reddit revision snapshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          UA={'User-Agent':'gsmg-historical-object-probe/1.4'}
          def get(url,timeout=30):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:return r.read()
          out={}

          # Primary Archive.org item metadata: identify the exact April-19 file and its size/hash.
          try:
              meta=json.loads(get('https://archive.org/metadata/archiveteam-twitter-stream-2019-04',30))
              files=[]
              for f in meta.get('files',[]):
                  name=f.get('name','')
                  if '2019_04_19' in name or '2019-04-19' in name or name.endswith('_files.xml') or name.endswith('_meta.xml'):
                      files.append({k:f.get(k) for k in ['name','size','md5','sha1','crc32','mtime','format','source']})
              out['twitter_april19_files']=files
              out['twitter_item_file_count']=len(meta.get('files',[]))
          except Exception as e: out['twitter_item_metadata_error']=repr(e)

          # Wayback availability around the Reddit creation and before the June edit.
          post='https://www.reddit.com/r/bitcoinpuzzles/comments/bf7siz/gsmgio_5_btc_puzzle_challenge/'
          for ts in ['20190420','20190421','20190422','20190501','20190601']:
              try:
                  q='https://archive.org/wayback/available?'+urllib.parse.urlencode({'url':post,'timestamp':ts})
                  out['reddit_wayback_'+ts]=json.loads(get(q,20))
              except Exception as e: out['reddit_wayback_'+ts+'_error']=repr(e)

          # Check old.reddit as a second rendering surface.
          old=post.replace('www.reddit.com','old.reddit.com')
          for ts in ['20190421','20190501','20190601']:
              try:
                  q='https://archive.org/wayback/available?'+urllib.parse.urlencode({'url':old,'timestamp':ts})
                  out['oldreddit_wayback_'+ts]=json.loads(get(q,20))
              except Exception as e: out['oldreddit_wayback_'+ts+'_error']=repr(e)

          print('GSMG_TARGETED_RECEIPT_BEGIN')
          print(json.dumps(out,ensure_ascii=False,separators=(',',':')))
          print('GSMG_TARGETED_RECEIPT_END')
          PY
