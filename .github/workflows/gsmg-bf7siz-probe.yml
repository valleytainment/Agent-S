name: Temporary GSMG fast historical-object probe

on:
  push:
    branches:
      - agent/gsmg-bf7siz-probe
    paths:
      - '.github/workflows/gsmg-bf7siz-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run fast exact-object checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,urllib.parse,urllib.request
          UA={'User-Agent':'gsmg-historical-object-probe/1.3'}
          def get(url,timeout=20):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:return r.read()
          out={}
          try:
              raw=get('https://arctic-shift.photon-reddit.com/api/comments/tree?link_id=t3_bf7siz&limit=9999')
              j=json.loads(raw); out['reddit_comments']=j
              out['reddit_comment_urls']=sorted(set(re.findall(r'https?://[^\"\\s<>]+',raw.decode('utf-8','replace'))))
          except Exception as e: out['reddit_comments_error']=repr(e)
          try:
              q='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode([
                  ('q','identifier:archiveteam-twitter-stream-2019-*'),('fl[]','identifier'),('fl[]','title'),('rows','200'),('page','1'),('output','json')])
              out['twitter_stream_items']=json.loads(get(q)).get('response',{}).get('docs',[])
          except Exception as e: out['twitter_stream_items_error']=repr(e)
          for key,url,ts in [
              ('twitter_profile','https://twitter.com/GSMG_Bot','20190419'),
              ('twitter_mobile','https://mobile.twitter.com/GSMG_Bot','20190419'),
              ('pastebin','https://pastebin.com/E3eGWaVP','20190508'),
              ('pastebin_raw','https://pastebin.com/raw/E3eGWaVP','20190508')]:
              try:
                  q='https://archive.org/wayback/available?'+urllib.parse.urlencode({'url':url,'timestamp':ts})
                  out[key+'_availability']=json.loads(get(q))
              except Exception as e: out[key+'_availability_error']=repr(e)
          print('GSMG_FAST_RECEIPT_BEGIN')
          print(json.dumps(out,ensure_ascii=False,separators=(',',':')))
          print('GSMG_FAST_RECEIPT_END')
          PY
