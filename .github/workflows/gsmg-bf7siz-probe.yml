name: Temporary GSMG historical-object probe

on:
  push:
    branches:
      - agent/gsmg-bf7siz-probe
    paths:
      - '.github/workflows/gsmg-bf7siz-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query Reddit comments, Twitter archives, and Pastebin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          UA={'User-Agent':'gsmg-historical-object-probe/1.2'}
          def get(url,timeout=45):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read()
          out={}

          # Reddit comments may quote or preserve the original media locator.
          try:
              raw=get('https://arctic-shift.photon-reddit.com/api/comments/tree?link_id=t3_bf7siz&limit=9999')
              data=json.loads(raw)
              out['reddit_comment_tree']=data
              blob=raw.decode('utf-8','replace')
              out['reddit_comment_media_urls']=sorted(set(re.findall(r'https?://[^\"\\s<>]+',blob)))
          except Exception as e:
              out['reddit_comment_tree_error']=repr(e)

          # Enumerate the actual ArchiveTeam 2019 Twitter stream item identifiers.
          try:
              q='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode({
                  'q':'identifier:archiveteam-twitter-stream-2019-*',
                  'fl[]':['identifier','title','publicdate'],
                  'rows':'200','page':'1','output':'json','sort[]':'identifier asc'
              },doseq=True)
              raw=get(q,timeout=60)
              j=json.loads(raw)
              out['archiveorg_2019_twitter_items']=j.get('response',{}).get('docs',[])
          except Exception as e:
              out['archiveorg_2019_twitter_items_error']=repr(e)

          # Wayback GSMG_Bot profile + status wildcard around launch window.
          twitter=[]
          for pattern in [
              'twitter.com/GSMG_Bot',
              'www.twitter.com/GSMG_Bot',
              'mobile.twitter.com/GSMG_Bot',
              'twitter.com/GSMG_Bot/status/*',
              'mobile.twitter.com/GSMG_Bot/status/*',
          ]:
              try:
                  q='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({
                      'url':pattern,'from':'20190401','to':'20190430','output':'json',
                      'fl':'timestamp,original,statuscode,mimetype,digest,length','filter':'statuscode:200','collapse':'urlkey'
                  })
                  raw=get(q,timeout=60); d=json.loads(raw)
                  if d:
                      for row in d[1:]: twitter.append(dict(zip(d[0],row)))
              except Exception as e:
                  twitter.append({'pattern':pattern,'error':repr(e)})
          out['wayback_twitter_april2019']=twitter

          # Pastebin exact object and raw form via CDX; replay any successful captures.
          pcdx=[]
          for u in ['https://pastebin.com/E3eGWaVP','https://pastebin.com/raw/E3eGWaVP','http://pastebin.com/E3eGWaVP','http://pastebin.com/raw/E3eGWaVP']:
              try:
                  q='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({
                      'url':u,'from':'2019','to':'2021','output':'json','fl':'timestamp,original,statuscode,mimetype,digest,length','filter':'statuscode:200','collapse':'digest'
                  })
                  raw=get(q,timeout=60); d=json.loads(raw)
                  if d:
                      for row in d[1:]: pcdx.append(dict(zip(d[0],row)))
              except Exception as e:
                  pcdx.append({'url':u,'error':repr(e)})
          out['pastebin_cdx']=pcdx
          out['pastebin_replays']=[]
          for x in [r for r in pcdx if r.get('timestamp')][:6]:
              try:
                  replay=f"https://web.archive.org/web/{x['timestamp']}id_/{x['original']}"
                  raw=get(replay,timeout=60)
                  txt=raw.decode('utf-8','replace')
                  out['pastebin_replays'].append({'timestamp':x['timestamp'],'original':x['original'],'bytes':len(raw),'text_sample':txt[:5000]})
              except Exception as e:
                  out['pastebin_replays'].append({'timestamp':x.get('timestamp'),'original':x.get('original'),'error':repr(e)})

          print('GSMG_MULTI_ARCHIVE_RECEIPT_BEGIN')
          print(json.dumps(out,ensure_ascii=False,separators=(',',':')))
          print('GSMG_MULTI_ARCHIVE_RECEIPT_END')
          PY
